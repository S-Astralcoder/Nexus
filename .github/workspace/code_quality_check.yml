name: Code Quality Check

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    check-flow:
        runs-on: ubuntu-latest

        steps:
            - name: CheckOut repo
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v10
              with: 
                enable-cache: true

            - name: Install dependency
              run: uv --sync --locked --dev

            - name: Run code quality check
              run: uv run ruff check .

            - name: Type check
              run: uv run pyright 